<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Usage Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    header h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    header span { font-size: 13px; color: #64748b; }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .month-nav button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .month-nav button:hover:not(:disabled) {
      background: #334155;
      color: #f1f5f9;
    }
    .month-nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .month-nav .month-label {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      min-width: 72px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px 20px;
    }

    .summary-card .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .summary-card .value {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .summary-card .value.success { color: #10b981; }
    .summary-card .value.warn    { color: #f59e0b; }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      margin-bottom: 24px;
    }

    .chart-card { padding: 20px 22px; }
    .chart-card h2 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    .chart-wrap { position: relative; }
    .chart-wrap.bar  { height: 260px; }
    .chart-wrap.donut { height: 220px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #334155;
    }
    tbody tr { border-bottom: 1px solid #1e293b; }
    tbody tr:hover { background: #1e293b88; }
    tbody td { padding: 11px 14px; color: #cbd5e1; }
    tbody td:first-child { color: #e2e8f0; font-weight: 500; font-family: monospace; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.high   { background: #10b98122; color: #10b981; }
    .badge.mid    { background: #f59e0b22; color: #f59e0b; }
    .badge.low    { background: #ef444422; color: #ef4444; }

    .delta {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .delta.up   { color: #f87171; }
    .delta.down { color: #60a5fa; }
    .delta.flat { color: #475569; }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }
    .no-data p { font-size: 15px; margin-bottom: 8px; }
    .no-data small { font-size: 12px; }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #334155;
      text-align: right;
    }
  </style>
</head>
<body>

<header>
  <h1>Skill Usage Dashboard</h1>
  <span id="period"></span>
  <div class="month-nav">
    <button id="btn-prev" title="이전 달">◀</button>
    <span class="month-label" id="nav-month"></span>
    <button id="btn-next" title="다음 달">▶</button>
  </div>
</header>

<div class="summary-grid" id="summary-grid"></div>

<div class="charts-row">
  <div class="card chart-card">
    <h2>스킬별 사용 횟수</h2>
    <div class="chart-wrap bar"><canvas id="barChart"></canvas></div>
  </div>
  <div class="card chart-card">
    <h2>성공 / 실패 비율</h2>
    <div class="chart-wrap donut"><canvas id="donutChart"></canvas></div>
  </div>
</div>

<div class="card" style="padding:0; overflow:hidden;">
  <table>
    <thead>
      <tr>
        <th>스킬</th>
        <th>사용 횟수</th>
        <th>전월 대비</th>
        <th>성공률</th>
        <th>평균 소요시간</th>
        <th>총 토큰</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<footer id="footer"></footer>

<script>
  // ── 데이터 주입 (render.py가 아래 라인을 치환) ──────────────────────────
  const PAYLOAD = __STATS_DATA__;
  // ────────────────────────────────────────────────────────────────────────

  let currentWeek = (PAYLOAD && PAYLOAD.current) || '';
  const allWeeks  = (PAYLOAD && PAYLOAD.weeks)   || [];
  const allData   = (PAYLOAD && PAYLOAD.data)    || {};

  let barChart   = null;
  let donutChart = null;

  function fmtDuration(ms) {
    if (!ms) return '—';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }

  function successRate(s) {
    if (!s.usage_count) return 0;
    return Math.round(s.success_count / s.usage_count * 100);
  }

  function badgeClass(rate) {
    if (rate >= 85) return 'high';
    if (rate >= 60) return 'mid';
    return 'low';
  }

  function fmtDelta(curr, prev) {
    if (prev === undefined) return '<span class="delta flat">NEW</span>';
    const diff = curr - prev;
    if (diff === 0) return '<span class="delta flat">—</span>';
    const pct  = prev > 0 ? Math.round(Math.abs(diff) / prev * 100) : 100;
    const sign = diff > 0 ? '+' : '';
    const arrow = diff > 0 ? '▲' : '▼';
    const cls   = diff > 0 ? 'up' : 'down';
    return `<span class="delta ${cls}">${arrow} ${Math.abs(diff)} (${sign}${diff > 0 ? '' : '-'}${pct}%)</span>`;
  }

  function updateNav() {
    const idx = allWeeks.indexOf(currentWeek);
    document.getElementById('nav-month').textContent = currentWeek;
    // allWeeks는 내림차순(최신→과거) → ◀ 이전 주 = idx+1, ▶ 다음 주 = idx-1
    document.getElementById('btn-prev').disabled = idx < 0 || idx >= allWeeks.length - 1;
    document.getElementById('btn-next').disabled = idx <= 0;
  }

  function renderWeek(week) {
    const DATA = allData[week];

    if (!DATA || !DATA.skills || Object.keys(DATA.skills).length === 0) {
      document.getElementById('summary-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#475569;">
          <p style="font-size:15px;margin-bottom:8px;">${week} 데이터가 없습니다.</p>
          <small style="font-size:12px;">해당 주에 수집된 스킬 사용 기록이 없습니다.</small>
        </div>`;
      document.getElementById('period').textContent = week;
      document.querySelector('.charts-row').style.display = 'none';
      document.querySelector('.card[style]').style.display = 'none';
      return;
    }

    document.querySelector('.charts-row').style.display = '';
    document.querySelector('.card[style]').style.display = '';
    document.getElementById('period').textContent = DATA.week || week;

    const skills = Object.entries(DATA.skills).sort(
      (a, b) => b[1].usage_count - a[1].usage_count
    );

    // ── 요약 카드 ──────────────────────────────────────────────────────────
    const totalUsage   = skills.reduce((s, [, v]) => s + v.usage_count, 0);
    const totalSuccess = skills.reduce((s, [, v]) => s + v.success_count, 0);
    const overallRate  = totalUsage ? Math.round(totalSuccess / totalUsage * 100) : 0;
    const rateClass    = overallRate >= 85 ? 'success' : overallRate >= 60 ? 'warn' : '';

    const summaries = [
      { label: '총 호출',   value: totalUsage },
      { label: '성공률',    value: overallRate + '%', cls: rateClass },
      { label: '추적 스킬', value: skills.length },
      { label: '총 세션',   value: DATA.session_count || '—' },
    ];

    document.getElementById('summary-grid').innerHTML = summaries.map(s => `
      <div class="card summary-card">
        <div class="label">${s.label}</div>
        <div class="value ${s.cls || ''}">${s.value}</div>
      </div>
    `).join('');

    // ── 바 차트 ────────────────────────────────────────────────────────────
    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: skills.map(([k]) => k),
        datasets: [{
          label: '사용 횟수',
          data: skills.map(([, v]) => v.usage_count),
          backgroundColor: '#3b82f6cc',
          borderRadius: 4,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'end',
            color: '#94a3b8',
            font: { size: 11, weight: '600' },
            formatter: v => v,
          }
        },
        layout: { padding: { right: 32 } },
        scales: {
          x: { ticks: { color: '#64748b', stepSize: 1 }, grid: { color: '#1e293b' }, max: Math.max(...skills.map(([, v]) => v.usage_count)) + 2 },
          y: { ticks: { color: '#94a3b8', font: { family: 'monospace', size: 11 } }, grid: { display: false } }
        }
      },
      plugins: [ChartDataLabels],
    });

    // ── 도넛 차트 ──────────────────────────────────────────────────────────
    const totalFail = totalUsage - totalSuccess;
    if (donutChart) donutChart.destroy();
    donutChart = new Chart(document.getElementById('donutChart'), {
      type: 'doughnut',
      data: {
        labels: ['성공', '실패'],
        datasets: [{
          data: [totalSuccess, totalFail],
          backgroundColor: ['#10b981cc', '#ef4444cc'],
          borderWidth: 0,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '68%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#94a3b8', font: { size: 12 }, padding: 16 }
          },
          datalabels: {
            color: '#f1f5f9',
            font: { size: 12, weight: '700' },
            formatter: (v, ctx) => {
              const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
              return total > 0 ? Math.round(v / total * 100) + '%' : '';
            },
          }
        }
      },
      plugins: [ChartDataLabels],
    });

    // ── 테이블 ─────────────────────────────────────────────────────────────
    const idx      = allWeeks.indexOf(week);
    const prevWeek  = idx >= 0 && idx < allWeeks.length - 1 ? allWeeks[idx + 1] : null;
    const prevSkills = prevWeek && allData[prevWeek] ? allData[prevWeek].skills || {} : null;

    document.getElementById('table-body').innerHTML = skills.map(([name, v]) => {
      const rate    = successRate(v);
      const avgMs   = v.usage_count ? Math.round(v.total_duration_ms / v.usage_count) : 0;
      const cls     = badgeClass(rate);
      const prevCnt = prevSkills ? (prevSkills[name] ? prevSkills[name].usage_count : undefined) : undefined;
      const delta   = prevSkills !== null ? fmtDelta(v.usage_count, prevCnt) : '<span class="delta flat">—</span>';
      return `
        <tr>
          <td>${name}</td>
          <td>${v.usage_count}</td>
          <td>${delta}</td>
          <td><span class="badge ${cls}">${rate}%</span></td>
          <td>${fmtDuration(avgMs)}</td>
          <td>${v.total_tokens ? v.total_tokens.toLocaleString() : '—'}</td>
        </tr>`;
    }).join('');
  }

  function init() {
    if (!PAYLOAD || Object.keys(allData).length === 0) {
      document.body.innerHTML = `
        <div class="no-data">
          <p>아직 수집된 데이터가 없습니다.</p>
          <small>스킬을 사용하면 자동으로 추적됩니다.</small>
        </div>`;
      return;
    }

    document.getElementById('footer').textContent =
      '생성: ' + new Date().toLocaleString('ko-KR');

    document.getElementById('btn-prev').addEventListener('click', () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx < allWeeks.length - 1) {
        currentWeek = allWeeks[idx + 1];
        updateNav();
        renderWeek(currentWeek);
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx > 0) {
        currentWeek = allWeeks[idx - 1];
        updateNav();
        renderWeek(currentWeek);
      }
    });

    updateNav();
    renderWeek(currentWeek);
  }

  init();
</script>
</body>
</html>
