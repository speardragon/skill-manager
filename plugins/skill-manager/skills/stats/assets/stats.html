<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Usage Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    :root {
      --bg-deep:      #030c1a;
      --bg-surface:   rgba(8, 22, 42, 0.65);
      --bg-elevated:  rgba(12, 32, 58, 0.5);
      --border-dim:   rgba(79, 172, 254, 0.07);
      --border-soft:  rgba(79, 172, 254, 0.14);
      --border-glow:  rgba(79, 172, 254, 0.3);
      --text-bright:  #edf4ff;
      --text-primary: #b8d0ea;
      --text-muted:   #4e7396;
      --text-faint:   #263f58;
      --accent-a:     #4facfe;
      --accent-b:     #00e0d0;
      --success:      #00d4aa;
      --warn:         #ffb74d;
      --danger:       #ff6b6b;
      --radius:       14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 36px 32px;
      overflow-x: hidden;
    }

    /* ── Aurora background ────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 75% -15%, rgba(79, 172, 254, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at -5% 85%, rgba(0, 224, 208, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(79, 172, 254, 0.02) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* ── Header ───────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    header span {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      padding: 4px 12px;
      border-radius: 99px;
      backdrop-filter: blur(8px);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .month-nav button {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .month-nav button:hover:not(:disabled) {
      border-color: var(--border-soft);
      color: var(--text-bright);
      box-shadow: 0 0 16px rgba(79, 172, 254, 0.08);
    }
    .month-nav button:disabled { opacity: 0.25; cursor: default; }
    .month-nav .month-label {
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-bright);
      min-width: 78px;
      text-align: center;
    }

    /* ── Cards ────────────────────────────────────────────── */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      border-color: var(--border-soft);
    }

    /* ── Summary grid ─────────────────────────────────────── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .summary-card {
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }
    .summary-card:hover::before { opacity: 1; }

    .summary-card:nth-child(2)::before {
      background: linear-gradient(90deg, var(--success), #00e0a0);
    }
    .summary-card:nth-child(3)::before {
      background: linear-gradient(90deg, #a78bfa, #818cf8);
    }
    .summary-card:nth-child(4)::before {
      background: linear-gradient(90deg, var(--warn), #ffd97a);
    }

    .summary-card .label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .summary-card .value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-bright);
      letter-spacing: -0.02em;
    }
    .summary-card .value.success {
      background: linear-gradient(135deg, var(--success), #00e0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .summary-card .value.warn {
      background: linear-gradient(135deg, var(--warn), #ffd97a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Charts row ───────────────────────────────────────── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      margin-bottom: 28px;
    }

    .chart-card { padding: 24px 26px; }
    .chart-card h2 {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-card h2::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 12px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
    }

    .chart-wrap { position: relative; }
    .chart-wrap.bar  { height: 260px; }
    .chart-wrap.donut { height: 220px; }

    /* ── Table ────────────────────────────────────────────── */
    .table-card {
      padding: 0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 14px 18px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border-dim);
      background: rgba(4, 14, 28, 0.4);
    }
    tbody tr {
      border-bottom: 1px solid rgba(79, 172, 254, 0.04);
      transition: background 0.2s ease;
    }
    tbody tr:hover { background: rgba(79, 172, 254, 0.04); }
    tbody td {
      padding: 13px 18px;
      color: var(--text-primary);
    }
    tbody td:first-child {
      color: var(--text-bright);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge.high {
      background: linear-gradient(135deg, rgba(0, 212, 170, 0.15), rgba(0, 224, 160, 0.08));
      color: var(--success);
      border: 1px solid rgba(0, 212, 170, 0.2);
    }
    .badge.mid {
      background: linear-gradient(135deg, rgba(255, 183, 77, 0.15), rgba(255, 217, 122, 0.08));
      color: var(--warn);
      border: 1px solid rgba(255, 183, 77, 0.2);
    }
    .badge.low {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(255, 96, 96, 0.08));
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    .delta {
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .delta.up   { color: var(--danger); }
    .delta.down { color: var(--accent-a); }
    .delta.flat { color: var(--text-faint); }

    /* ── No data ──────────────────────────────────────────── */
    .no-data {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .no-data p {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-primary);
    }
    .no-data small { font-size: 13px; color: var(--text-muted); }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-faint);
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .summary-grid, .charts-row, .table-card {
      animation: fadeUp 0.5s ease both;
    }
    .charts-row { animation-delay: 0.08s; }
    .table-card { animation-delay: 0.16s; }
  </style>
</head>
<body>

<header>
  <h1>Skill Usage Dashboard</h1>
  <span id="period"></span>
  <div class="month-nav">
    <button id="btn-prev" title="이전 주">&#9664;</button>
    <span class="month-label" id="nav-month"></span>
    <button id="btn-next" title="다음 주">&#9654;</button>
  </div>
</header>

<div class="summary-grid" id="summary-grid"></div>

<div class="charts-row">
  <div class="card chart-card">
    <h2>스킬별 사용 횟수</h2>
    <div class="chart-wrap bar"><canvas id="barChart"></canvas></div>
  </div>
  <div class="card chart-card">
    <h2>성공 / 실패 비율</h2>
    <div class="chart-wrap donut"><canvas id="donutChart"></canvas></div>
  </div>
</div>

<div class="card table-card">
  <table>
    <thead>
      <tr>
        <th>스킬</th>
        <th>사용 횟수</th>
        <th>전주 대비</th>
        <th>성공률</th>
        <th>평균 소요시간</th>
        <th>총 토큰</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<footer id="footer"></footer>

<script>
  // ── 데이터 주입 (render.py가 아래 라인을 치환) ──────────────────────────
  const PAYLOAD = __STATS_DATA__;
  // ────────────────────────────────────────────────────────────────────────

  let currentWeek = (PAYLOAD && PAYLOAD.current) || '';
  const allWeeks  = (PAYLOAD && PAYLOAD.weeks)   || [];
  const allData   = (PAYLOAD && PAYLOAD.data)    || {};

  let barChart   = null;
  let donutChart = null;

  /* ── Chart.js defaults ──────────────────────────────────────────────── */
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  function fmtDuration(ms) {
    if (!ms) return '\u2014';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }

  function successRate(s) {
    if (!s.usage_count) return 0;
    return Math.round(s.success_count / s.usage_count * 100);
  }

  function badgeClass(rate) {
    if (rate >= 85) return 'high';
    if (rate >= 60) return 'mid';
    return 'low';
  }

  function fmtDelta(curr, prev) {
    if (prev === undefined) return '<span class="delta flat">NEW</span>';
    const diff = curr - prev;
    if (diff === 0) return '<span class="delta flat">\u2014</span>';
    const pct  = prev > 0 ? Math.round(Math.abs(diff) / prev * 100) : 100;
    const sign = diff > 0 ? '+' : '';
    const arrow = diff > 0 ? '\u25B2' : '\u25BC';
    const cls   = diff > 0 ? 'up' : 'down';
    return `<span class="delta ${cls}">${arrow} ${Math.abs(diff)} (${sign}${diff > 0 ? '' : '-'}${pct}%)</span>`;
  }

  function updateNav() {
    const idx = allWeeks.indexOf(currentWeek);
    document.getElementById('nav-month').textContent = currentWeek;
    document.getElementById('btn-prev').disabled = idx < 0 || idx >= allWeeks.length - 1;
    document.getElementById('btn-next').disabled = idx <= 0;
  }

  /* ── Gradient helper for Chart.js ───────────────────────────────────── */
  function createBarGradient(ctx, chartArea) {
    const g = ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
    g.addColorStop(0, 'rgba(79, 172, 254, 0.85)');
    g.addColorStop(1, 'rgba(0, 224, 208, 0.85)');
    return g;
  }

  function renderWeek(week) {
    const DATA = allData[week];

    if (!DATA || !DATA.skills || Object.keys(DATA.skills).length === 0) {
      document.getElementById('summary-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-muted);">
          <p style="font-size:15px;margin-bottom:8px;color:var(--text-primary);font-weight:600;">${week} \uB370\uC774\uD130\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</p>
          <small style="font-size:12px;">\uD574\uB2F9 \uC8FC\uC5D0 \uC218\uC9D1\uB41C \uC2A4\uD0AC \uC0AC\uC6A9 \uAE30\uB85D\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.</small>
        </div>`;
      document.getElementById('period').textContent = week;
      document.querySelector('.charts-row').style.display = 'none';
      document.querySelector('.table-card').style.display = 'none';
      return;
    }

    document.querySelector('.charts-row').style.display = '';
    document.querySelector('.table-card').style.display = '';
    document.getElementById('period').textContent = DATA.week || week;

    const skills = Object.entries(DATA.skills).sort(
      (a, b) => b[1].usage_count - a[1].usage_count
    );

    // ── 요약 카드 ──────────────────────────────────────────────────────────
    const totalUsage   = skills.reduce((s, [, v]) => s + v.usage_count, 0);
    const totalSuccess = skills.reduce((s, [, v]) => s + v.success_count, 0);
    const overallRate  = totalUsage ? Math.round(totalSuccess / totalUsage * 100) : 0;
    const rateClass    = overallRate >= 85 ? 'success' : overallRate >= 60 ? 'warn' : '';

    const summaries = [
      { label: '\uCD1D \uD638\uCD9C',   value: totalUsage },
      { label: '\uC131\uACF5\uB960',    value: overallRate + '%', cls: rateClass },
      { label: '\uCD94\uC801 \uC2A4\uD0AC', value: skills.length },
      { label: '\uCD1D \uC138\uC158',   value: DATA.session_count || '\u2014' },
    ];

    document.getElementById('summary-grid').innerHTML = summaries.map(s => `
      <div class="card summary-card">
        <div class="label">${s.label}</div>
        <div class="value ${s.cls || ''}">${s.value}</div>
      </div>
    `).join('');

    // ── 바 차트 ────────────────────────────────────────────────────────────
    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: skills.map(([k]) => k),
        datasets: [{
          label: '\uC0AC\uC6A9 \uD69F\uC218',
          data: skills.map(([, v]) => v.usage_count),
          backgroundColor: function(context) {
            const chart = context.chart;
            const { ctx, chartArea } = chart;
            if (!chartArea) return 'rgba(79, 172, 254, 0.7)';
            return createBarGradient(ctx, chartArea);
          },
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'end',
            color: 'rgba(79, 172, 254, 0.7)',
            font: { size: 11, weight: '700', family: "'JetBrains Mono', monospace" },
            formatter: v => v,
          }
        },
        layout: { padding: { right: 36 } },
        scales: {
          x: {
            ticks: { color: 'rgba(78, 115, 150, 0.6)', stepSize: 1, font: { size: 10 } },
            grid: { color: 'rgba(79, 172, 254, 0.04)' },
            border: { display: false },
            max: Math.max(...skills.map(([, v]) => v.usage_count)) + 2,
          },
          y: {
            ticks: { color: '#b8d0ea', font: { family: "'JetBrains Mono', monospace", size: 11 } },
            grid: { display: false },
            border: { display: false },
          }
        }
      },
      plugins: [ChartDataLabels],
    });

    // ── 도넛 차트 ──────────────────────────────────────────────────────────
    const totalFail = totalUsage - totalSuccess;
    if (donutChart) donutChart.destroy();
    donutChart = new Chart(document.getElementById('donutChart'), {
      type: 'doughnut',
      data: {
        labels: ['\uC131\uACF5', '\uC2E4\uD328'],
        datasets: [{
          data: [totalSuccess, totalFail],
          backgroundColor: ['rgba(0, 212, 170, 0.75)', 'rgba(255, 107, 107, 0.65)'],
          hoverBackgroundColor: ['rgba(0, 212, 170, 0.95)', 'rgba(255, 107, 107, 0.85)'],
          borderWidth: 0,
          spacing: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '72%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#b8d0ea',
              font: { size: 12, weight: '500' },
              padding: 20,
              usePointStyle: true,
              pointStyleWidth: 8,
            }
          },
          datalabels: {
            color: '#edf4ff',
            font: { size: 13, weight: '800' },
            formatter: (v, ctx) => {
              const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
              return total > 0 ? Math.round(v / total * 100) + '%' : '';
            },
          }
        }
      },
      plugins: [ChartDataLabels],
    });

    // ── 테이블 ─────────────────────────────────────────────────────────────
    const idx      = allWeeks.indexOf(week);
    const prevWeek  = idx >= 0 && idx < allWeeks.length - 1 ? allWeeks[idx + 1] : null;
    const prevSkills = prevWeek && allData[prevWeek] ? allData[prevWeek].skills || {} : null;

    document.getElementById('table-body').innerHTML = skills.map(([name, v]) => {
      const rate    = successRate(v);
      const avgMs   = v.usage_count ? Math.round(v.total_duration_ms / v.usage_count) : 0;
      const cls     = badgeClass(rate);
      const prevCnt = prevSkills ? (prevSkills[name] ? prevSkills[name].usage_count : undefined) : undefined;
      const delta   = prevSkills !== null ? fmtDelta(v.usage_count, prevCnt) : '<span class="delta flat">\u2014</span>';
      return `
        <tr>
          <td>${name}</td>
          <td>${v.usage_count}</td>
          <td>${delta}</td>
          <td><span class="badge ${cls}">${rate}%</span></td>
          <td>${fmtDuration(avgMs)}</td>
          <td>${v.total_tokens ? v.total_tokens.toLocaleString() : '\u2014'}</td>
        </tr>`;
    }).join('');
  }

  function init() {
    if (!PAYLOAD || Object.keys(allData).length === 0) {
      document.body.innerHTML = `
        <div class="no-data">
          <p>\uC544\uC9C1 \uC218\uC9D1\uB41C \uB370\uC774\uD130\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</p>
          <small>\uC2A4\uD0AC\uC744 \uC0AC\uC6A9\uD558\uBA74 \uC790\uB3D9\uC73C\uB85C \uCD94\uC801\uB429\uB2C8\uB2E4.</small>
        </div>`;
      return;
    }

    document.getElementById('footer').textContent =
      'Generated ' + new Date().toLocaleString('ko-KR');

    document.getElementById('btn-prev').addEventListener('click', () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx < allWeeks.length - 1) {
        currentWeek = allWeeks[idx + 1];
        updateNav();
        renderWeek(currentWeek);
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx > 0) {
        currentWeek = allWeeks[idx - 1];
        updateNav();
        renderWeek(currentWeek);
      }
    });

    updateNav();
    renderWeek(currentWeek);
  }

  init();
</script>
</body>
</html>
