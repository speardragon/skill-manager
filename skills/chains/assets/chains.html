<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Chain Analysis</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    header h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    header span { font-size: 13px; color: #64748b; }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .month-nav button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .month-nav button:hover:not(:disabled) {
      background: #334155;
      color: #f1f5f9;
    }
    .month-nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .month-nav .month-label {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      min-width: 72px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px 20px;
    }

    .summary-card .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .summary-card .value {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .summary-card .sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chart-card { padding: 20px 22px; margin-bottom: 14px; }
    .chart-card h2 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .mermaid-wrap {
      background: #0f172a;
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
    }

    /* override mermaid SVG text colors */
    .mermaid svg { max-width: 100%; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #334155;
    }
    tbody tr { border-bottom: 1px solid #1e293b; }
    tbody tr:hover { background: #1e293b88; }
    tbody td { padding: 11px 14px; color: #cbd5e1; }
    tbody td.pattern { color: #e2e8f0; font-weight: 500; font-family: monospace; font-size: 12px; }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag.bottleneck { background: #ef444422; color: #ef4444; }
    .tag.ok         { background: #10b98122; color: #10b981; }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }
    .no-data p { font-size: 15px; margin-bottom: 8px; }
    .no-data small { font-size: 12px; }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #334155;
      text-align: right;
    }
  </style>
</head>
<body>

<header>
  <h1>Skill Chain Analysis</h1>
  <span id="period"></span>
  <div class="month-nav">
    <button id="btn-prev" title="이전 달">◀</button>
    <span class="month-label" id="nav-month"></span>
    <button id="btn-next" title="다음 달">▶</button>
  </div>
</header>

<div class="summary-grid" id="summary-grid"></div>

<div class="card chart-card">
  <h2>체인 플로우 다이어그램</h2>
  <div class="mermaid-wrap">
    <div class="mermaid" id="mermaid-diagram">flowchart LR</div>
  </div>
</div>

<div class="card" style="padding:0; overflow:hidden;">
  <table>
    <thead>
      <tr>
        <th>체인 패턴</th>
        <th>실행 횟수</th>
        <th>평균 총 소요시간</th>
        <th>상태</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<footer id="footer"></footer>

<script>
  // ── 데이터 주입 (render.py가 아래 라인을 치환) ──────────────────────────
  const PAYLOAD = __CHAINS_DATA__;
  // ────────────────────────────────────────────────────────────────────────

  let currentWeek = (PAYLOAD && PAYLOAD.current) || '';
  const allWeeks  = (PAYLOAD && PAYLOAD.weeks)   || [];
  const allData   = (PAYLOAD && PAYLOAD.data)    || {};

  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    themeVariables: {
      background: '#0f172a',
      primaryColor: '#1e3a5f',
      primaryTextColor: '#e2e8f0',
      primaryBorderColor: '#3b82f6',
      lineColor: '#475569',
      secondaryColor: '#1e293b',
      tertiaryColor: '#1e293b',
      edgeLabelBackground: '#1e293b',
      fontSize: '13px',
    },
    flowchart: { curve: 'basis', padding: 20 }
  });

  function fmtDuration(ms) {
    if (!ms) return '—';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }

  function sanitizeId(s) {
    return s.replace(/[^a-zA-Z0-9]/g, '_');
  }

  function updateNav() {
    const idx = allWeeks.indexOf(currentWeek);
    document.getElementById('nav-month').textContent = currentWeek;
    // allWeeks는 내림차순(최신→과거) → ◀ 이전 주 = idx+1, ▶ 다음 주 = idx-1
    document.getElementById('btn-prev').disabled = idx < 0 || idx >= allWeeks.length - 1;
    document.getElementById('btn-next').disabled = idx <= 0;
  }

  async function renderWeek(week) {
    const DATA = allData[week];

    if (!DATA || !DATA.chains || Object.keys(DATA.chains).length === 0) {
      document.getElementById('summary-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#475569;">
          <p style="font-size:15px;margin-bottom:8px;">${week} 체인 데이터가 없습니다.</p>
          <small style="font-size:12px;">한 세션에서 2개 이상의 스킬을 연속 사용하면 체인이 기록됩니다.</small>
        </div>`;
      document.getElementById('period').textContent = week;
      document.querySelector('.chart-card').style.display = 'none';
      document.querySelector('.card[style*="padding:0"]').style.display = 'none';
      return;
    }

    document.querySelector('.chart-card').style.display = '';
    document.querySelector('.card[style*="padding:0"]').style.display = '';
    document.getElementById('period').textContent = DATA.week || week;

    const chains = Object.entries(DATA.chains).sort(
      (a, b) => b[1].count - a[1].count
    );

    // ── 요약 카드 ──────────────────────────────────────────────────────────
    const totalRuns = chains.reduce((s, [, v]) => s + v.count, 0);
    const topChain  = chains[0];

    document.getElementById('summary-grid').innerHTML = `
      <div class="card summary-card">
        <div class="label">고유 체인 패턴</div>
        <div class="value">${chains.length}</div>
      </div>
      <div class="card summary-card">
        <div class="label">총 체인 실행</div>
        <div class="value">${totalRuns}</div>
      </div>
      <div class="card summary-card">
        <div class="label">가장 빈번한 체인</div>
        <div class="value">${topChain ? topChain[1].count + '회' : '—'}</div>
        <div class="sub">${topChain ? topChain[0] : ''}</div>
      </div>
    `;

    // ── Mermaid 다이어그램 빌드 ────────────────────────────────────────────
    const edgeCount = {};
    for (const [pattern, info] of chains) {
      const steps = pattern.split(' → ');
      for (let i = 0; i < steps.length - 1; i++) {
        const key = steps[i] + '|||' + steps[i + 1];
        edgeCount[key] = (edgeCount[key] || 0) + info.count;
      }
    }

    const maxEdge = Math.max(...Object.values(edgeCount), 1);

    const nodeSet = new Set();
    for (const [pattern] of chains) {
      pattern.split(' → ').forEach(s => nodeSet.add(s));
    }

    let diagram = 'flowchart LR\n';
    for (const node of nodeSet) {
      diagram += `  ${sanitizeId(node)}["${node}"]\n`;
    }
    for (const [edge, count] of Object.entries(edgeCount)) {
      const [from, to] = edge.split('|||');
      const thickness = Math.max(1, Math.round(count / maxEdge * 4));
      const style = thickness >= 3 ? '==>' : '-->';
      diagram += `  ${sanitizeId(from)} ${style}|"${count}회"| ${sanitizeId(to)}\n`;
    }

    const el = document.getElementById('mermaid-diagram');
    el.removeAttribute('data-processed');
    el.textContent = diagram;
    await mermaid.run({ nodes: [el] });

    // ── 테이블 ─────────────────────────────────────────────────────────────
    const allAvgMs  = chains.map(([, v]) => v.count ? v.total_duration_ms / v.count : 0);
    const globalAvg = allAvgMs.reduce((a, b) => a + b, 0) / (allAvgMs.length || 1);

    document.getElementById('table-body').innerHTML = chains.map(([pattern, v]) => {
      const avgMs        = v.count ? Math.round(v.total_duration_ms / v.count) : 0;
      const isBottleneck = avgMs > globalAvg * 2;
      return `
        <tr>
          <td class="pattern">${pattern}</td>
          <td>${v.count}</td>
          <td>${fmtDuration(avgMs)}</td>
          <td><span class="tag ${isBottleneck ? 'bottleneck' : 'ok'}">${isBottleneck ? '병목' : '정상'}</span></td>
        </tr>`;
    }).join('');
  }

  async function init() {
    if (!PAYLOAD || Object.keys(allData).length === 0) {
      document.body.innerHTML = `
        <div class="no-data">
          <p>아직 체인 데이터가 없습니다.</p>
          <small>한 세션에서 2개 이상의 스킬을 연속 사용하면 체인이 기록됩니다.</small>
        </div>`;
      return;
    }

    document.getElementById('footer').textContent =
      '생성: ' + new Date().toLocaleString('ko-KR');

    document.getElementById('btn-prev').addEventListener('click', async () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx < allWeeks.length - 1) {
        currentWeek = allWeeks[idx + 1];
        updateNav();
        await renderWeek(currentWeek);
      }
    });

    document.getElementById('btn-next').addEventListener('click', async () => {
      const idx = allWeeks.indexOf(currentWeek);
      if (idx > 0) {
        currentWeek = allWeeks[idx - 1];
        updateNav();
        await renderWeek(currentWeek);
      }
    });

    updateNav();
    await renderWeek(currentWeek);
  }

  init();
</script>
</body>
</html>
